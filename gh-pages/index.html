<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 id="pageHeader">PART BUILDER</h1>
    
    <div id="filePickerSection" style="text-align: center; margin-bottom: 20px;">
      <input type="file" id="jsonFilePicker" accept=".json" style="display: none;" />
      <button onclick="document.getElementById('jsonFilePicker').click()" class="reset-btn">
        Load Different JSON File
      </button>
      <span id="loadedFileName" style="margin-left: 15px; color: #2c3e50; font-size: 14px;"></span>
    </div>
    
    <div class="builder-container">
      <div id="dropdownsContainer" class="dropdowns-row"></div>
      
      <div id="optionsPanel" class="hidden options-panel">
        <div class="options-title" id="optionsPanelTitle">Select an Option</div>
        <div class="options-table-container" id="optionsTableContainer"></div>
      </div>
      
      <div id="partNumberDisplay" class="hidden part-number-display">
        <div class="part-number-label">Generated Part Number</div>
        <div id="partNumValue" class="part-number-value"></div>
        <div class="part-number-label">Full Description</div>
        <div id="partDescValue" class="part-desc-value"></div>
        <div style="margin-top: 15px;">
          <button class="pick-btn" onclick="pickPartNumber()">Pick</button>
          <button class="reset-btn" onclick="resetBuilder()">Reset</button>
        </div>
      </div>
      
      <div id="pickedPartsContainer" class="hidden picked-parts-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <div class="part-number-label">Picked Parts</div>
          <div>
            <button class="add-btn" onclick="resetBuilder()">+ Add Another</button>
            <button class="done-btn" onclick="copyPickedPartsToClipboard()">Done</button>
            <button class="clear-btn" onclick="clearPickedParts()">Clear All</button>
          </div>
        </div>
        <div id="pickedPartsList" class="picked-parts-list"></div>
      </div>
    </div>
  </div>
  
  <script>
    // Detect if loaded in iframe and hide non-essential elements
    if (window !== window.parent) {
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('pageHeader').style.display = 'none';
        document.getElementById('filePickerSection').style.display = 'none';
        document.body.style.padding = '0';
        document.querySelector('.builder-container').style.margin = '0';
        document.querySelector('.builder-container').style.borderRadius = '0';
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
